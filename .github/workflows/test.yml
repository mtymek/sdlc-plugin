name: Test

# These two commands (vet, test) are mirrored in lefthook.yml's pre-push hook —
# keep them in sync so local and CI never diverge on what green means.
# The Node "Test release scripts" step is intentionally CI-only: lefthook
# does not run it, so run it by hand when touching .github/scripts/,
# internal/dashboard/web/, or cmd/design-preview/. It runs three test sets:
# .github/scripts/__tests__/*.test.cjs,
# internal/dashboard/web/testdata/view.test.cjs, and
# cmd/design-preview/testdata/marks.test.cjs. Copy the command of that step.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tests that run the real openspec CLI (e.g. TestStage_RealCLIOmittedScenario)
      # skip when it is not on PATH. Pin the version so a CLI release cannot
      # change test results without a commit here.
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.1

      # Pinned jj release, verified by SHA-256 before extraction. Tests that need
      # a real jj use internal/jjtest; SDLC_REQUIRE_JJ=1 below turns a missing
      # jj into a failure instead of a skip.
      - name: Install jj
        run: |
          set -euo pipefail
          JJ_VERSION=0.46.0
          JJ_SHA256=fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
          curl -fsSL -o jj.tar.gz "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JJ_SHA256}  jj.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf jj.tar.gz -C "$HOME/.local/bin" ./jj
          rm jj.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jj" --version

      # SDLC_REQUIRE_JJ is CI-only on purpose. lefthook.yml's pre-push hook
      # runs the same go test command without it, so on a machine without jj
      # the jj tests skip locally and only CI requires them.
      - name: Test
        env:
          SDLC_REQUIRE_JJ: "1"
        run: go test -tags integration ./...

      - name: Test release scripts
        run: node --test .github/scripts/__tests__/*.test.cjs internal/dashboard/web/testdata/view.test.cjs cmd/design-preview/testdata/marks.test.cjs
